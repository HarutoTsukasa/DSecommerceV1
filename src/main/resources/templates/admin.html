<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring eCommerce — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-body-tertiary">

<div class="d-flex">
    <!-- Sidebar -->
    <aside class="sidebar text-light p-3 flex-shrink-0">
        <h5 class="text-primary-brand fw-bold mb-4">Spring Admin</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-light active" href="#metricas">Panel</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="#pedidos">Pedidos</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="#productos">Productos</a></li>
            <li class="nav-item mt-4"><a class="nav-link text-light" href="/">← Volver a la tienda</a></li>
        </ul>
    </aside>

    <!-- Main -->
    <main class="flex-grow-1">
        <header class="d-flex justify-content-between align-items-center bg-body border-bottom px-4 py-3">
            <h5 class="mb-0">Dashboard</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm" id="btnTema" type="button">🌙</button>
                <span class="badge bg-secondary align-self-center">admin@spring.test</span>
            </div>
        </header>

        <div class="p-4">
            <!-- Métricas -->
            <section id="metricas" class="row g-3 mb-4">
                <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body"><p class="text-muted small mb-1">Ingresos</p><h4 class="text-primary-brand" th:text="'$' + ${totalVentas}">$0</h4></div></div></div>
                <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body"><p class="text-muted small mb-1">Pedidos</p><h4 th:text="${totalPedidos}">0</h4></div></div></div>
                <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body"><p class="text-muted small mb-1">Clientes</p><h4 th:text="${totalClientes}">0</h4></div></div></div>
                <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body"><p class="text-muted small mb-1">Productos</p><h4 th:text="${#lists.size(productos)}">0</h4></div></div></div>
            </section>

            <!-- Pedidos recientes -->
            <section id="pedidos" class="card shadow-sm mb-4">
                <div class="card-body">
                    <h6 class="mb-3">Pedidos recientes</h6>
                    <table id="tablaPedidos" class="table table-striped align-middle" style="width:100%">
                        <thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead>
                        <tbody>
                            <tr th:each="o : ${ordenes}">
                                <td th:text="${o.id}"></td>
                                <td th:text="${#temporals.format(o.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${o.comprador.nombre}"></td>
                                <td th:text="'$' + ${o.total}"></td>
                                <td><span class="badge" th:classappend="'badge-' + ${o.estado.toLowerCase()}" th:text="${o.estado}"></span></td>
                                <td><button class="btn btn-sm btn-outline-danger btn-del-orden" th:attr="data-id=${o.id}">Eliminar</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Productos (CRUD) -->
            <section id="productos" class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0">Productos</h6>
                        <button class="btn btn-brand btn-sm" data-bs-toggle="modal" data-bs-target="#prodModal" id="btnNuevoProd">+ Nuevo producto</button>
                    </div>
                    <table id="tablaProductos" class="table table-striped align-middle" style="width:100%">
                        <thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Vendedor</th><th>Acciones</th></tr></thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.nombre}"></td>
                                <td th:text="'$' + ${p.precio}"></td>
                                <td th:text="${p.stock}"></td>
                                <td th:text="${p.vendedor.nombre}"></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-secondary btn-edit-prod"
                                        th:attr="data-id=${p.id},data-nombre=${p.nombre},data-desc=${p.descripcion},data-precio=${p.precio},data-stock=${p.stock},data-img=${p.imagenUrl}">Editar</button>
                                    <button class="btn btn-sm btn-outline-danger btn-del-prod" th:attr="data-id=${p.id}">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<!-- Modal producto -->
<div class="modal fade" id="prodModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Producto</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="prodId">
                <div class="mb-2"><label class="form-label">Nombre</label><input class="form-control" id="prodNombre" required></div>
                <div class="mb-2"><label class="form-label">Descripción</label><textarea class="form-control" id="prodDesc"></textarea></div>
                <div class="mb-2"><label class="form-label">Precio</label><input type="number" step="0.01" class="form-control" id="prodPrecio" required></div>
                <div class="mb-2"><label class="form-label">Stock</label><input type="number" class="form-control" id="prodStock" required></div>
                <div class="mb-2"><label class="form-label">Imagen (URL)</label><input class="form-control" id="prodImg"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-brand" id="btnGuardarProd">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
